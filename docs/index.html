<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QNR-144 &mdash; 144-tone MFSK weak-signal modem</title>
<meta name="description" content="QNR-144: a 144-tone MFSK weak-signal HF chat modem running entirely in the browser.">
<style>:root {
  --bg: #0b0f12;
  --panel: #11171c;
  --edge: #1e2a33;
  --fg: #cfd8dc;
  --dim: #6b7f8a;
  --green: #43d17c;
  --cyan: #4fd0e7;
  --amber: #e8b64c;
  --red: #e8615a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 14px;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px;
  gap: 10px;
}

header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 0.06em;
  color: var(--green);
}

.sub { color: var(--dim); font-size: 12px; }
.spacer { flex: 1; }

.pill {
  border: 1px solid var(--edge);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
}

#meters {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 6px;
  padding: 8px 10px;
}

.meter { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
.meter label { width: 26px; }
.meter span { width: 62px; text-align: right; color: var(--fg); }

.bar {
  width: 150px;
  height: 9px;
  background: #0a0e11;
  border: 1px solid var(--edge);
  border-radius: 3px;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--green), var(--amber) 78%, var(--red));
  transition: width 90ms linear;
}

#spectrum {
  flex: 1;
  min-width: 220px;
  height: 44px;
  background: #070a0c;
  border: 1px solid var(--edge);
  border-radius: 3px;
  image-rendering: pixelated;
}

#term {
  flex: 1;
  min-height: 220px;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 6px;
  padding: 10px 12px;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.45;
  outline: none;
}

#term:focus-within, #term:focus { border-color: #2f4a5a; }

#out .l { display: block; }
.c-dim { color: var(--dim); }
.c-green { color: var(--green); }
.c-cyan { color: var(--cyan); }
.c-amber { color: var(--amber); }
.c-red { color: var(--red); }
.c-rx { color: var(--green); font-weight: 600; }

#line { display: flex; gap: 6px; align-items: baseline; }
#prompt { color: var(--cyan); flex: none; }
#input { white-space: pre-wrap; word-break: break-word; }

#cursor { color: var(--green); animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

footer { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

button {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 4px;
  padding: 4px 9px;
  cursor: pointer;
}

button:hover { border-color: var(--green); color: var(--green); }

.hint { color: var(--dim); font-size: 11px; }
kbd {
  border: 1px solid var(--edge);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
  font-size: 10px;
}

@media (max-width: 640px) {
  .bar { width: 90px; }
  #spectrum { min-width: 140px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>QNR&#8209;144</h1>
    <span class="sub">144&#8209;tone MFSK weak&#8209;signal chat modem &mdash; running in your browser</span>
    <span class="spacer"></span>
    <span id="ctxrate" class="pill" title="Audio context sample rate">audio: idle</span>
  </header>

  <div id="meters">
    <div class="meter"><label>IN</label><div class="bar"><i id="inbar"></i></div><span id="indb">&mdash;</span></div>
    <div class="meter"><label>OUT</label><div class="bar"><i id="outbar"></i></div><span id="outdb">&mdash;</span></div>
    <canvas id="spectrum" width="512" height="64" title="Received tone spectrum"></canvas>
  </div>

  <div id="term" tabindex="0" role="log" aria-label="QNR terminal">
    <div id="out"></div>
    <div id="line"><span id="prompt">qnr&gt;</span><span id="input"></span><span id="cursor">&#9608;</span></div>
  </div>

  <footer>
    <button data-cmd="help">help</button>
    <button data-cmd="info">info</button>
    <button data-cmd="devices">devices</button>
    <button data-cmd="mic on">mic on</button>
    <button data-cmd="selftest">selftest</button>
    <button data-cmd="sim -18 poor">sim -18 poor</button>
    <span class="hint">click the terminal and type &mdash; <kbd>Tab</kbd> completes, <kbd>&uarr;</kbd> recalls</span>
  </footer>
</div>

      if (hit) write('PASS  "' + hit.text + '"  ' + hit.bursts + 'x LLR, ' +
        hit.offsetHz.toFixed(1) + ' Hz, ' + hit.driftPpm.toFixed(0) + ' ppm   ' + r.ms + ' ms', 'c-green');
      else write('no decode at ' + snr + ' dB (' + r.ms + ' ms) - try a higher SNR', 'c-red');
      setBusy(false);
    }, function (e) { tick.stop(); setBusy(false); throw e; });
  });

  def('about', 'what this page is', function () {
    write('');
    write('  QNR-144 is a weak-signal chat modem for HF radio.', 'c-cyan');
    write('  Point this page\'s audio at a transceiver (or just play it across a room)');
    write('  and another station running the same page, or the qnr command-line');
    write('  program, can decode it.');
    write('');
    write('  Everything runs locally: no server, no upload, no network requests.', 'c-dim');
    write('');
  });

  /* -------------------------------------------------------------------- boot */

  write('QNR-144  144-tone MFSK weak-signal chat modem', 'c-green');
  write(M.info.tones + ' tones, ' + M.info.lowHz.toFixed(0) + '-' + M.info.highHz.toFixed(0) + ' Hz, ' +
    M.info.baud + ' Bd, K=7 rate-1/3 + Viterbi, CRC-16', 'c-dim');
  write('');
  write('Type "help" for commands, or "selftest" to prove the DSP works right now.', 'c-cyan');
  write('For live receive use "mic on"; to transmit, "tx CQ CQ DE QNR".');
  write('');
  showLevel(inBar, inDb, -60);
  showLevel(outBar, outDb, -60);
  drawSpectrum(null);
  redraw();
  termEl.focus();
})();
</script>
